name: CI

on:
  push:
    branches: [main, master, 'agent/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  java:
    name: Java 21 build and tests
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Java modules
        run: mvn -B clean package

  web-console:
    name: Vue console build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-console/package.json

      - name: Install dependencies
        working-directory: web-console
        run: npm install --no-audit --no-fund

      - name: Build console
        working-directory: web-console
        run: npm run build

  secret-scan:
    name: Tracked secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files
        shell: bash
        run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----'; then
            echo 'Potential secret detected in tracked files.'
            exit 1
          fi
