server:
  port: 8080

spring:
  application:
    name: ai-remote-helper-relay
  datasource:
    url: jdbc:postgresql://localhost:15432/testdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 16379
