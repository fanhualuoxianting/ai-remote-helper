services:
  airh-postgres:
    image: postgres:16-alpine
    container_name: airh-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - airh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  airh-redis:
    image: redis:7-alpine
    container_name: airh-redis
    ports:
      - "16379:6379"
    volumes:
      - airh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  airh-postgres-data:
  airh-redis-data:
